name: Release

# Push a tag "vX.Y.Z" to make a GitHub Release with the packages for Chrome and Firefox.
# See docs/releasing.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Make sure the tag and package.json have the same version
        run: |
          VERSION=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: bun run check
      - run: bun scripts/package.ts
      - run: bun scripts/changelog.ts "$VERSION" > release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "IC3 $VERSION" \
            --notes-file release-notes.md \
            "web-ext-artifacts/ic3-chrome-$VERSION.zip" \
            "web-ext-artifacts/ic3-firefox-$VERSION.zip"
