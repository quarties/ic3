name: CI

# Run only when the code or a file that the code reads changes.
# pull_request uses the same list through the YAML anchor &code.
on:
  push:
    branches: [main]
    paths: &code
      - 'src/**'
      - 'static/**'
      - 'scripts/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *code

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
