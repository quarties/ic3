<!-- IC3 logo with the name: the icon (logo.svg) and "IC3". "IC" is upright, the "3" is italic
     like in the icon. Variant for a dark background (README in dark mode). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 384">
  <defs>
    <linearGradient id="tile-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26a85a"/>
      <stop offset="1" stop-color="#0f6b35"/>
    </linearGradient>
  </defs>
  <g id="icon" transform="scale(0.75)">
    <rect width="512" height="512" rx="112" fill="url(#tile-gradient)"/>
    <g fill="#ffffff">
      <rect x="70" y="168" width="84" height="58" rx="26"/>
      <rect x="76" y="230" width="78" height="178" rx="36" transform="rotate(-8 115 319)"/>
      <rect x="92" y="352" width="222" height="68" rx="32"/>
      <rect x="186" y="416" width="40" height="28"/>
      <rect x="136" y="438" width="140" height="24" rx="12"/>
    </g>
    <g transform="translate(248 82) scale(2.55) skewX(-10)">
      <path d="M6 8 H44 Q56 8 56 20 V24 Q56 36 44 36 H24 M44 36 Q56 36 56 48 V54 Q56 66 44 66 H6"
        fill="none" stroke="#ffa94d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g id="wordmark" fill="none" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#e6edf3">
      <path transform="translate(440 96) scale(2.6)" d="M8 8 V66"/>
      <path transform="translate(500 96) scale(2.6)" d="M56 8 H20 Q6 8 6 22 V52 Q6 66 20 66 H56"/>
    </g>
    <path transform="translate(732 96) scale(2.6) skewX(-10)" stroke="#f08a24"
      d="M6 8 H44 Q56 8 56 20 V24 Q56 36 44 36 H24 M44 36 Q56 36 56 48 V54 Q56 66 44 66 H6"/>
  </g>
</svg>
